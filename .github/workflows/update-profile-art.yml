name: Update profile art
on:
  schedule:
    - cron: "17 */3 * * *"  # every 3 hours, so the cards trail GitHub by hours, not a day
  workflow_dispatch:
  push:
    paths: ["scripts/**", "fonts/**", ".github/workflows/update-profile-art.yml"]
permissions:
  contents: write
concurrency:
  group: profile-art
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_readme_cards.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git pull --rebase -X theirs origin main  # a push may have landed while this ran
          git push
